[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "bedrock-chat"
version = "0.1.0"
description = "TermTuck: token-efficient terminal AI chat with images and local history"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.38.0,<2",
    "Pillow>=13.0.0,<14",
    "prompt-toolkit>=3.0.50,<4",
    "rich>=14,<16",
]

[project.scripts]
termtuck = "bedrock_chat.cli:main"
bedrock-chat = "bedrock_chat.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
